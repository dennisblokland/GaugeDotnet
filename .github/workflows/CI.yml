name: CI
permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install system libraries
      run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libdbus-1-dev
    - name: Check formatting
      run: cargo fmt --all --check
    - name: Test
      run: cargo test --workspace --locked
    - name: Test the device app with SDL and Bluetooth
      run: cargo test --locked -p gauge-app --features sdl,ble
