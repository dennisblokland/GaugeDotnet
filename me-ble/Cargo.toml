[package]
name = "me-ble"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Compile libdbus from source instead of linking the system one (cross builds).
vendored-dbus = ["dep:dbus"]

[dependencies]
dbus = { version = "0.9", optional = true, features = ["vendored"] }
btleplug = "0.13"
futures = "0.3"
me-data = { version = "0.1.0", path = "../me-data" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
uuid = "1"
