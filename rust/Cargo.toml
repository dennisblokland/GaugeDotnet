[workspace]
resolver = "2"
members = ["gauge-render", "gauge-app", "gauge-designer", "me-data", "me-ble"]
# Plain `cargo run` / `cargo build` / `cargo test` stay on the device app; the
# designer is built with `-p gauge-designer`.
default-members = ["gauge-render", "gauge-app", "me-data", "me-ble"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.80"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
